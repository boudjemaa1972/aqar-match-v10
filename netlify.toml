# ─── Aqar Match — Netlify Deployment Config ────────────────────────
# This file tells Netlify how to build and deploy the Next.js app.
# It ensures Prisma client is generated during the build step.
# ───────────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# ─── Next.js plugin (handles SSR, API routes, static optimization) ──
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─── Required environment variables (set in Netlify dashboard) ──────
# These MUST be set in Netlify → Site settings → Environment variables.
# Do NOT put real secrets in this file — it's committed to git.
#
# MANDATORY (app fails to start without these):
#   DATABASE_URL           = postgresql://... (Supabase connection string)
#   ENCRYPTION_PASSPHRASE  = (≥16 chars, generate with: openssl rand -base64 48)
#   ENCRYPTION_KEY_SALT    = (≥16 chars, generate with: openssl rand -base64 32)
#   CRON_SECRET            = (≥16 chars, generate with: openssl rand -base64 48)
#
# FOR EMAIL AUTH (signup + verification + password reset):
#   EMAIL_MODE   = "production"
#   EMAIL_FROM   = "no-reply@yourdomain.com"
#   SMTP_HOST    = "smtp.your-provider.com"
#   SMTP_PORT    = "587"
#   SMTP_SECURE  = "false"
#   SMTP_USER    = "your-smtp-username"
#   SMTP_PASS    = "your-smtp-password"
#
# FOR PHONE OTP (optional — if not set, OTP works in dev mode only):
#   OTP_MODE     = "dev" (or "production" once SMS provider is integrated)
#
# OPTIONAL:
#   NEXT_PUBLIC_GOOGLE_MAPS_API_KEY = (for LocationPicker map)
#   NEXTAUTH_SECRET                 = (generate with: openssl rand -base64 32)
#   NEXTAUTH_URL                    = "https://your-site.netlify.app"
# ───────────────────────────────────────────────────────────────────
